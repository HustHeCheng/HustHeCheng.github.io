---
layout: default
---
<header>
  <h1 class="site-title"><a href="{{ "/" | relative_url }}">{{ site.title }}</a></h1>
  <p class="site-note">HustHeCheng</p>
</header>

{% assign poems = site.poems | sort: "date" | reverse %}
{% for poem in poems %}
<article>
  <h2 class="poem-title"><a href="{{ poem.url }}">{{ poem.title }}</a></h2>
  <time datetime="{{ poem.date | date: '%Y-%m-%d' }}">{{ poem.date | date: "%Y.%m.%d" }}</time>
  <div class="poem">{{ poem.content }}</div>
</article>
{% endfor %}

<p class="how">记下一首：在 <code>_poems/</code> 里新建 Markdown。写上 title 和 date，一行一句，空行分节。示例可以删掉。</p>
